[package]
name = "likeness-contract"
description = "Likeness: face licences, escrow and per-render receipts on NEAR, with non-transferable licence tokens"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
